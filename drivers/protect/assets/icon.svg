<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Enheten sett rett forfra: den avrundede firkanten, ringen rundt knappen,
       og knappen selv.

       Ikke tegnet på skrå, selv om produktbilder viser den slik. Homey rendrer
       driverikonet som en maske i én farge, og perspektiv uten skygge blir
       bare en skjev firkant — på 24 piksler, som er der ikonet faktisk lever,
       leser silhuetten forfra langt tydeligere.

       Eksplisitt fill på hver bane: en manglende eller ugyldig fill gir blankt
       ikon i iPhone-appen selv når nettleseren viser det fint. -->
  <path fill="#000000" fill-rule="evenodd" d="
    M74 16h108c32 0 58 26 58 58v108c0 32-26 58-58 58H74c-32 0-58-26-58-58V74c0-32 26-58 58-58z
    M128 56c-39.8 0-72 32.2-72 72s32.2 72 72 72 72-32.2 72-72-32.2-72-72-72z"/>
  <circle fill="#000000" cx="128" cy="128" r="54"/>
</svg>
